<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Room</title>
<!--
  Local code war room, served by war_room_server.py. Behavior lives in app.js, loaded from
  this origin only: the server's Content-Security-Policy allows no inline script, and no
  element here carries an inline handler. Rules: Infrastructure/rules/code-war-room-rules.md.
-->
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8fafc; --panel:#fff; --line:#e2e8f0; --ink:#1e293b; --mute:#64748b;
    --faint:#94a3b8; --accent:#2563eb;
    --high:#ea580c; --medium:#ca8a04; --low:#64748b;
    --confirmed:#16a34a; --needs:#ea580c; --misread:#7c3aed; --unresolved:#ca8a04;
  }
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}

  header{background:#1e293b;color:#f1f5f9;padding:.7rem 1.1rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
  header h1{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
  header .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;color:#94a3b8}
  header .who{font-size:.74rem;color:#94a3b8}
  header .spacer{flex:1}
  .prog{font-size:.78rem;color:#cbd5e1}
  .bar{height:5px;background:#334155;border-radius:3px;width:150px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}

  .wrap{flex:1;display:flex;min-height:0}

  /* ── block list ── */
  aside{width:270px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;flex-shrink:0}
  .bitem{padding:.5rem .7rem;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:.5rem;align-items:flex-start;font-size:.8rem}
  .bitem:hover{background:#f1f5f9}
  .bitem.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--accent)}
  .bitem .id{font-family:ui-monospace,monospace;color:var(--faint);font-size:.7rem;min-width:2.6rem}
  .bitem .t{flex:1;line-height:1.35}
  .bitem .ln{color:var(--faint);font-size:.68rem}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:.35rem;flex-shrink:0}
  .dot.confirmed{background:var(--confirmed)} .dot.needs-change{background:var(--needs)}
  .dot.misread-by-agent{background:var(--misread)} .dot.unresolved{background:var(--unresolved)}
  .d-high{color:var(--high)} .d-medium{color:var(--medium)} .d-low{color:var(--low)}

  /* ── main ── */
  main{flex:1;overflow-y:auto;padding:1.1rem 1.3rem;min-width:0}
  .crumb{font-size:.78rem;color:var(--mute);margin-bottom:.5rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .tag{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.1rem .4rem;border-radius:3px;background:#f1f5f9;color:var(--mute)}
  h2{font-size:1.1rem;font-weight:600;margin-bottom:.7rem}
  h3{font-size:.95rem;font-weight:600;margin:.2rem 0 .5rem}

  pre{background:#0f172a;color:#e2e8f0;border-radius:6px;padding:.75rem .9rem;overflow-x:auto;margin-bottom:.9rem}
  pre code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.55;white-space:pre}
  .ln-no{color:#475569;user-select:none}

  .drift{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:.5rem .8rem;font-size:.82rem;margin-bottom:.8rem}
  .note{background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:.5rem .8rem;font-size:.82rem;color:var(--mute);margin-bottom:.8rem}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:start}
  .pane{border:1px solid var(--line);border-radius:6px;padding:.8rem .9rem;background:var(--panel)}
  .pane.pred{background:#f8fafc}
  .plabel{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:.45rem;display:flex;justify-content:space-between;gap:.5rem}
  .plabel .conf{color:var(--faint);font-weight:600}
  .locknote{font-size:.7rem;color:var(--faint);margin-top:.6rem;font-style:italic}
  .ptext{font-size:.88rem;margin-bottom:.5rem}
  .sub{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:.6rem 0 .25rem}
  ul.as{margin-left:1.05rem;font-size:.85rem} ul.as li{margin-bottom:.2rem}

  label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:.55rem 0 .25rem}
  textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:5px;padding:.45rem .55rem;
    font:inherit;font-size:.87rem;resize:vertical;background:#fff;color:var(--ink)}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  textarea{min-height:3.4rem}

  .disp{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0 .2rem}
  .disp button{font:inherit;font-size:.78rem;font-weight:600;padding:.35rem .6rem;border-radius:5px;
    border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer}
  .disp button:hover{border-color:var(--faint)}
  .disp button.sel{color:#fff;border-color:transparent}
  .disp button.sel[data-d=confirmed]{background:var(--confirmed)}
  .disp button.sel[data-d=needs-change]{background:var(--needs)}
  .disp button.sel[data-d=misread-by-agent]{background:var(--misread)}
  .disp button.sel[data-d=unresolved]{background:var(--unresolved)}
  .disp .k{opacity:.6;font-weight:400;margin-left:.25rem}

  .foot{display:flex;gap:.6rem;align-items:center;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line);flex-wrap:wrap}
  .btn{font:inherit;font-size:.85rem;font-weight:600;padding:.45rem .9rem;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .btn.p{background:var(--accent);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.45;cursor:default}
  .flagbox{display:flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--mute)}
  .endorsed{font-size:.78rem;color:var(--confirmed);font-weight:600}
  .status{font-size:.78rem;color:var(--faint);margin-left:auto}
  .status.ok{color:var(--confirmed)} .status.err{color:#b91c1c}

  details.seg{margin-top:.9rem;font-size:.82rem}
  details.seg summary{cursor:pointer;color:var(--mute);font-weight:600}
  details.seg .row{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
  details.seg input{width:5.5rem}
  .warn{font-size:.75rem;color:var(--mute);margin-top:.4rem}

  /* ── block map (spec M27, D5) ── */
  #block-map{max-width:1000px}
  #block-map table{width:100%;border-collapse:collapse;font-size:.83rem;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #block-map th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--mute);padding:.45rem .6rem;border-bottom:1px solid var(--line);background:#f8fafc}
  #block-map td{padding:.4rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  #block-map td.id{font-family:ui-monospace,monospace;color:var(--faint);font-size:.75rem}
  #block-map td.num{font-family:ui-monospace,monospace;font-size:.75rem;color:var(--mute);white-space:nowrap}
  #block-map .mapacts{display:flex;gap:.3rem;flex-wrap:wrap}
  #block-map .mapacts button{font:inherit;font-size:.72rem;padding:.2rem .45rem;border-radius:4px;
    border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer}
  #block-map .mapacts input{width:4.2rem;font-size:.72rem;padding:.15rem .3rem}
  #fast-forward-selector{border:1px solid var(--line);border-radius:6px;background:#fffbeb;
    padding:.7rem .9rem;margin:.9rem 0}
  #fast-forward-selector .ffhead{font-weight:600;font-size:.87rem;margin-bottom:.3rem}
  .mapfoot{display:flex;gap:.6rem;align-items:center;margin-top:1rem;flex-wrap:wrap}

  kbd{font-family:ui-monospace,monospace;font-size:.7rem;background:#f1f5f9;border:1px solid var(--line);
      border-bottom-width:2px;border-radius:3px;padding:.05rem .3rem;color:var(--mute)}
  @media(max-width:900px){.cols{grid-template-columns:1fr}aside{display:none}}
  #reviewer-form{max-width:26rem}
  .ffwarn{margin:0 0 .5rem}
  .mapfoot .warn{margin:0}
  .btn.small{padding:.15rem .5rem;font-size:.75rem}
  .warn.keys{margin-top:.8rem}
</style>
</head>
<body>
<header>
  <h1>War Room</h1>
  <span class="path" id="hpath"></span>
  <span class="who" id="hwho"></span>
  <span class="spacer"></span>
  <span class="prog" id="hprog"></span>
  <span class="bar"><i id="hbar"></i></span>
</header>

<div class="wrap">
  <aside id="list"></aside>
  <main id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
