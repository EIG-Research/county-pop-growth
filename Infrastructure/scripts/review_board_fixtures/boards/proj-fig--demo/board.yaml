# Fixture board for the review-board test suite. Synthetic: nothing here is a real review.
schema_version: 1
project:
  id: proj-fig
board:
  id: demo
  title: Fixture board (synthetic)
  medium: print
  fixture: true

reviewers:
  - id: owner1
    role: owner
    name: Fixture Owner
  - id: rev1
    role: reviewer
    name: Fixture Reviewer

render:
  argv: ["{python}", "code/make_figs.py"]
  expected_runtime: under a second
  timeout_seconds: 60

items:
  - id: fig-bars
    title: Synthetic bars
    group: main
    sources: [code/make_figs.py, code/params.json]
    render: output/figures/fig-bars.png
    svg: output/figures/fig-bars.svg
    frozen: false
  - id: fig-shares
    title: Synthetic shares
    group: main
    sources: [code/make_figs.py, code/params.json]
    render: output/figures/fig-shares.png
    svg: output/figures/fig-shares.svg
    frozen: false
  - id: fig-table
    title: Synthetic table
    group: appendix
    sources: [code/make_figs.py, code/params.json]
    render: output/figures/fig-table.png
    svg: null
    frozen: true
