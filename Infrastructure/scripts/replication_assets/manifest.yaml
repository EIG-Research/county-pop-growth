# Replication package manifest
#
# Declares what this project publishes in its public replication package.
# Read by Infrastructure/scripts/build_replication_package.py (via
# validate_replication_manifest.py). Governed by
# Infrastructure/rules/replication-publishing-rules.md.
#
# The DENYLIST is immovable: Infrastructure/, records/, .claude/, .codex/,
# .agents/, CLAUDE.md, AGENTS.md, Makefile, .git/, drafts/, output/logs/, review-reports/,
# and raw/processed data (unless explicitly opted in below) are NEVER published.
# You may narrow or extend `include`/`exclude`, but you cannot allowlist a denied path.

# Where to write the export. Leave blank for the default:
#   ../<project-folder-name>-replication  (a sibling of this repo, outside it).
output_dir: ""

# Extra paths to publish beyond the defaults (code/, output/figures/, output/tables/).
# Paths are relative to the project root. Dotfiles never ship unless listed here by exact
# path (for example ".Rprofile"), and they are scanned like everything else.
include: []

# Extra paths to exclude on top of the denylist.
exclude: []

# Raw data is excluded by default. Set true ONLY if you have confirmed the raw
# inputs are cleared for public release (license, privacy, confidentiality).
include_raw_data: false

# Processed/derived data is excluded by default. Set true to ship data/processed/.
include_processed_data: false

# License for the public repo. Leave blank to be reminded to choose one; no
# LICENSE file is written until a license is named. Example: "MIT", "CC-BY-4.0".
# A named license gets a placeholder LICENSE: paste the license's full text into it.
license: ""

# Optional citation metadata used to render CITATION.cff. Unfilled fields are
# marked [to confirm]; nothing is fabricated.
citation:
  authors: []          # e.g. ["Glasner, Benjamin"]: "Family, Given", or one name
  title: ""
  year: ""
  url: ""
