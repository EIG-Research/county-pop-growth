<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review board</title>
<!--
  Local review board, served by review_board_server.py. Behavior lives in app.js, loaded
  from this origin only (the server's Content-Security-Policy allows no inline script).
  Rules: Infrastructure/rules/review-board-rules.md.
-->
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #d9d9d9;
    --accent: #024140; --accent-ink: #ffffff; --warn-bg: #fdf3dc; --warn-ink: #5a4200;
    --bad-bg: #fbe4df; --bad-ink: #7a1f0a; --ok-bg: #e2f0ea; --ok-ink: #0f4a36;
    --focus: #176f96;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141515; --panel: #1d1f1f; --ink: #ececea; --muted: #a8aaa8; --line: #3a3d3d;
      --accent: #5e9c86; --accent-ink: #0b1a14; --warn-bg: #3a300f; --warn-ink: #f3dc9b;
      --bad-bg: #401b13; --bad-ink: #f6b7a6; --ok-bg: #16362a; --ok-ink: #a7dcc4;
      --focus: #79c5fd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  button, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink);
                                border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
         justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); }
  .top h1 { margin: 0; font-size: 20px; }
  .muted { color: var(--muted); margin: 2px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           padding: 4px 6px; }
  .banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 6px;
            background: var(--warn-bg); color: var(--warn-ink); }
  .banner ul { margin: 6px 0 0; padding-left: 20px; }
  .groups { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
  .cards { display: grid; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px; display: grid; gap: 14px; grid-template-columns: minmax(0, 3fr)
          minmax(0, 2fr); scroll-margin-top: 12px; }
  .card:focus { outline: 2px solid var(--focus); }
  @media (max-width: 760px) { .card { grid-template-columns: minmax(0, 1fr); } }
  .card h2 { margin: 0; font-size: 17px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
  .id { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--muted); }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .tag.changed, .tag.new { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .tag.frozen { background: var(--line); }
  .figure { margin: 10px 0 0; }
  .figure img, .figure canvas { display: block; max-width: 100%; height: auto;
      border: 1px solid var(--line); border-radius: 4px; background: #fff;
      min-width: 240px; }
  /* Only the difference canvas wants hard pixel edges. A downscaled render drawn nearest-neighbour
     drops most of its pixels, so slide text reads jagged and smeared; renders scale smoothly
     (RB-S5; test case 11). */
  .figure canvas { image-rendering: pixelated; }
  .compare { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 30px; border: 1px dashed var(--line); border-radius: 6px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       margin: 0 0 3px; }
  .block p { margin: 0; white-space: pre-wrap; }
  .stale { background: var(--bad-bg); color: var(--bad-ink); padding: 8px 10px; border-radius: 6px;
           margin: 0; }
  .status-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px;
           overflow: auto; }
  .notes li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
  .notes li.change-request { border-color: var(--bad-ink); }
  .notes li.status { color: var(--muted); font-size: 13px; }
  .note-head { font-size: 12px; color: var(--muted); }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .composer { display: grid; gap: 6px; }
  .composer textarea { width: 100%; min-height: 64px; resize: vertical; padding: 6px;
                       background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .checks { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .fail { color: var(--bad-ink); } .pass { color: var(--ok-ink); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); margin: 0;
           background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px;
           max-width: min(90vw, 640px); }
  .hint { font-size: 12px; color: var(--muted); padding: 0 16px 16px; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="board-title">Review board</h1>
    <p id="round-line" class="muted">Loading…</p>
  </div>
  <div class="controls">
    <label>Reviewing as <select id="reviewer" aria-label="Reviewer"></select></label>
    <button id="copy" type="button">Copy all feedback</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<nav id="groups" class="groups" aria-label="Groups"></nav>
<main id="cards" class="cards"></main>
<p class="hint">← → or j / k move between items. One point per note.</p>
<p id="toast" class="toast" role="status" hidden></p>
<script src="/app.js"></script>
</body>
</html>
