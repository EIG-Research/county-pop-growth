# =============================================================================
# Dataset registry: recognized public datasets, read by the review agents.
# Field reference: Infrastructure/references/datasets/README.md.
# Check: python3 Infrastructure/scripts/validate_dataset_registry.py
#
# Consumers read this file instead of carrying copies:
#   - methodology-reviewer -> weights and pitfalls (MR-WEIGHTS, MR-SURVEY)
#   - document-data        -> identification signals and currency queries
#   - ai-skeptic           -> known_variables (AS-VARIABLE: is a variable name real?)
#
# VERIFICATION (independent of layer):
#   unverified -> nobody has signed the entry against a source. Every template entry
#                 starts here (owner-review queue, 3B O9): treat it as a lead.
#   parsed     -> an agent extracted it from a cited source; confirm before a HIGH.
#   verified   -> a person checked it against `sources` and signed `verified_by`
#                 and `verified_on`. Only a person signs.
#
# Never invent a variable, universe, or weight. Flag gaps as "[unverified: ...]".
# =============================================================================
datasets:
  # ---------------------------------------------------------------------------
  - id: cps
    name: Current Population Survey (CPS)
    layer: template
    verification: unverified
    kind: survey
    agency: U.S. Census Bureau and Bureau of Labor Statistics
    identification:
      file_patterns: ["cps_*", "cepr_cps_*", "morg_*", "asec_*", "cps_asec_*", "ipums_cps*", "cps_00*"]
      signal_variables: ["wtfinl", "earnwt", "asecwt", "hwtfinl", "asecwth", "PWSSWGT", "PWCMPWGT", "PWORWGT", "MARSUPWT", "HSUP_WGT", "FSUP_WGT", "A_FNLWGT", "A_ERNLWT", "ASECWT", "HWHHWGT"]
      loaders: ["ipumsr::read_ipums_micro() with CPS DDI", "cepr_* functions"]
      comments: ["Current Population Survey", "CPS", "ASEC", "March supplement"]
    known_variables: ["wtfinl", "earnwt", "asecwt", "hwtfinl", "asecwth", "PWSSWGT", "PWCMPWGT", "PWORWGT", "MARSUPWT", "HSUP_WGT", "FSUP_WGT", "A_FNLWGT", "A_ERNLWT", "ASECWT", "HWHHWGT"]
    weights:
      - context: Basic monthly (person)
        ipums_name: wtfinl
        source_name: PWSSWGT
        notes: Final person weight for basic monthly labor force data.
      - context: Basic monthly (household)
        ipums_name: hwtfinl
        source_name: HWHHWGT
        notes: Household weight for basic monthly.
      - context: Earner study / outgoing rotation
        ipums_name: earnwt
        source_name: PWORWGT
        notes: Earnings weight for ORG (outgoing rotation) respondents only.
      - context: ASEC supplement (person)
        ipums_name: asecwt
        source_name: MARSUPWT
        notes: >-
          ASEC supplement person weight; required for any income/poverty analysis. The
          public-use field has 2 implied decimals (255212 = 2552.12). ASECWT is the IPUMS name.
      - context: ASEC supplement (household)
        ipums_name: asecwth
        source_name: HSUP_WGT
        notes: >-
          ASEC supplement household weight; public-use HSUP_WGT has 2 implied decimals
          (255212 = 2552.12). FSUP_WGT is the family weight.
    pitfalls:
      - id: cps-wtfinl-for-asec
        description: Using wtfinl for ASEC income analysis (must use asecwt).
        severity: HIGH
        why: >-
          The basic monthly weight ignores the ASEC supplement's oversampling
          design and produces incorrect income and poverty statistics.
        what_to_check: "Confirm asecwt (not wtfinl) is used for any income/poverty estimate."
      - id: cps-topcoded-income
        description: Topcoded income variables (inctot, incwage, ftotval) not addressed.
        severity: MEDIUM
        what_to_check: "Verify topcoding is acknowledged, swapped to internal values, or excluded."
      - id: cps-mixing-basic-asec
        description: Mixing basic monthly and ASEC variables without appropriate weights.
        severity: HIGH
        what_to_check: "Confirm each variable is paired with the weight for its data product."
    sources:
      - title: ASEC 2024 Public Use Data Dictionary (U.S. Census Bureau)
        url: https://www2.census.gov/programs-surveys/cps/datasets/2024/march/asec2024_ddl_pub_full.pdf
      - title: IPUMS CPS variable description, ASECWTH
        url: https://cps.ipums.org/cps-action/variables/ASECWTH
    currency:
      search_strategy: '"Current Population Survey" latest annual data site:census.gov OR site:bls.gov'
      ipums_search_strategy: '"IPUMS CPS" latest data year site:ipums.org'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: acs
    name: American Community Survey (ACS)
    layer: template
    verification: unverified
    kind: survey
    agency: U.S. Census Bureau
    identification:
      file_patterns: ["acs_*", "acs5yr_*", "acs1_*", "pums_*", "acs_pums_*", "ipums_acs*", "ipums_usa*", "usa_00*"]
      signal_variables: ["perwt", "hhwt", "PWGTP", "WGTP", "PWGTP*", "WGTP*", "REPWTP*", "REPWT*"]
      loaders: ["tidycensus::get_acs()", "tidycensus::get_pums()", "ipumsr::read_ipums_micro()"]
      comments: ["American Community Survey", "ACS", "PUMS"]
    known_variables: ["perwt", "hhwt", "PWGTP", "WGTP", "PWGTP*", "WGTP*", "REPWTP*", "REPWT*"]
    weights:
      - context: Person-level
        ipums_name: perwt
        source_name: PWGTP
        notes: Person weight for all person-level analyses.
      - context: Household-level
        ipums_name: hhwt
        source_name: WGTP
        notes: Household weight for housing/household analyses.
      - context: Replicate weights (person)
        ipums_name: REPWTP1-REPWTP80
        source_name: PWGTP1-PWGTP80
        notes: >-
          80 successive difference replication (SDR) weights for standard errors:
          SE = sqrt(4/80 * sum over r of (X_r - X)^2).
      - context: Replicate weights (household)
        ipums_name: REPWT1-REPWT80
        source_name: WGTP1-WGTP80
        notes: 80 SDR replicate weights for household and housing-unit standard errors.
    pitfalls:
      - id: acs-person-weight-for-household
        description: Using person weight (perwt) for household-level analysis.
        severity: HIGH
        what_to_check: "Confirm the weight matches the unit of analysis (person vs. household)."
      - id: acs-no-replicate-weights
        description: Not using replicate weights for standard error estimation.
        severity: LOW
        what_to_check: >-
          Accept a design declared with the IPUMS USA STRATA and CLUSTER variables (2005
          onward, strata are PUMAs), which IPUMS provides for this purpose. Otherwise require
          SDR with the 80 replicate weights (PWGTP1-PWGTP80 or WGTP1-WGTP80; IPUMS
          REPWTP/REPWT), the Census Bureau's method; the Census PUMS files carry no strata or
          cluster variables. The published alternative is the generalized variance (design
          factor) method.
      - id: acs-topcoded-income
        description: Topcoded income variables not addressed.
        severity: MEDIUM
      - id: acs-mixing-1yr-5yr
        description: Mixing 1-year and 5-year estimates without acknowledging different time periods.
        severity: MEDIUM
    sources:
      - title: American Community Survey 2019-2023 5-Year PUMS User Guide (U.S. Census Bureau)
        url: https://www2.census.gov/programs-surveys/acs/tech_docs/pums/2019_2023ACS_PUMS_User_Guide.pdf
      - title: IPUMS USA variable description, REPWTP
        url: https://usa.ipums.org/usa-action/variables/REPWTP
      - title: IPUMS USA, Variance estimation user notes (STRATA and CLUSTER)
        url: https://usa.ipums.org/usa/complex_survey_vars/userNotes_variance.shtml
    currency:
      search_strategy_1yr: '"American Community Survey 1-year" latest release site:census.gov'
      search_strategy_5yr: '"American Community Survey 5-year" latest release site:census.gov'
      ipums_search_strategy: '"IPUMS USA" latest data year site:ipums.org'
    vintages: []
    variables: []
    docs: []
