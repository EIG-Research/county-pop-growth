    pitfalls:
      - id: atus-module-weight
        description: Using ATUS person weight for module-specific analysis (must use module weight).
        severity: HIGH
      - id: atus-day-of-week
        description: Not accounting for day-of-week distribution in time use analysis.
        severity: MEDIUM
    currency:
      search_strategy: '"American Time Use Survey" latest release site:bls.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: ce
    name: Consumer Expenditure Survey (CE)
    layer: template
    verification: unverified
    kind: survey
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["ce_*", "cx_*", "fmli_*", "mtbi_*", "diary_*", "consumer_exp*"]
      signal_variables: ["finlwt21", "FINLWT21", "wtrep01", "wtrep44", "repwt"]
      loaders: []
      comments: ["Consumer Expenditure", "CE Survey", "CEX"]
    known_variables: ["finlwt21", "FINLWT21", "wtrep01", "wtrep44", "repwt"]
    weights:
      - context: Interview survey (CU-level)
        source_name: finlwt21 / FINLWT21
        notes: Consumer unit weight (interview).
      - context: Diary survey
        source_name: FINLWT21 (diary)
        notes: Consumer unit weight (diary).
      - context: Replicate weights
        source_name: wtrep01-wtrep44
        notes: 44 replicate weights for variance estimation.
    pitfalls:
      - id: ce-mixing-interview-diary
        description: Mixing interview and diary survey data without appropriate weighting.
        severity: HIGH
      - id: ce-no-replicate-weights
        description: Not using replicate weights for variance estimation.
        severity: LOW
    currency:
      search_strategy: '"Consumer Expenditure Survey" latest release site:bls.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: scf
    name: Survey of Consumer Finances (SCF)
    layer: template
    verification: unverified
    kind: survey
    agency: Federal Reserve Board
    identification:
      file_patterns: ["scf_*", "scfp_*", "rscfp_*", "survey_consumer*"]
      signal_variables: ["X42001", "YY1", "WT1B*"]
      loaders: []
      comments: ["Survey of Consumer Finances", "SCF"]
    known_variables: ["X42001", "WGT", "YY1", "Y1", "WT1B*", "MM*"]
    weights:
      - context: Main file, one implicate at a time
        source_name: X42001
        notes: >-
          Final weight; each implicate's weights sum to the household population. When
          the five implicates are pooled, divide X42001 by 5.
      - context: Summary extract, implicates pooled
        source_name: WGT
        notes: Defined as X42001/5 in the Federal Reserve's bulletin macro; do not divide it again.
      - context: Replicate weights (sampling variance)
        source_name: WT1B1-WT1B999
        notes: >-
          999 bootstrap replicate weights with multiplicities MM1-MM999 (use weight times
          multiplicity), computed for the first implicate only. Total standard error =
          sqrt((6/5) * imputation variance + sampling variance).
    pitfalls:
      - id: scf-single-implicate
        description: Using only one implicate instead of combining all five.
        severity: HIGH
        why: >-
          Each SCF case has five implicates. YY1 is the case ID and Y1 = 10 * YY1 +
          implicate number, so the implicate is Y1 - 10 * YY1. One implicate gives a valid
          but less efficient point estimate and omits imputation variance, so its
          standard errors are too small.
        what_to_check: >-
          Confirm all five implicates are used and combined (Rubin 1987; the codebook
          scales imputation variance by 6/5).
      - id: scf-no-weight
        description: Not using the SCF weight variable.
        severity: HIGH
      - id: scf-pooled-weight-scaling
        description: >-
          Population totals from pooled implicates use the undivided X42001 (five times too
          large) or divide the summary extract's WGT by 5 a second time.
        severity: HIGH
        what_to_check: "Only totals and counts are affected; means, shares, and ratios are not."
      - id: scf-no-replicate-weights
        description: >-
          Standard errors omit sampling variance because the 999 replicate weights
          (WT1B1-WT1B999 with MM1-MM999) are not used.
        severity: LOW
    sources:
      - title: 2022 SCF Codebook (Federal Reserve Board)
        url: https://www.federalreserve.gov/econres/files/codebk2022.txt
      - title: SCF bulletin tables SAS macro (Federal Reserve Board)
        url: https://www.federalreserve.gov/econres/files/bulletin.macro.txt
      - title: SCF standard error documentation (Federal Reserve Board)
        url: https://www.federalreserve.gov/econres/files/standard_error_documentation.pdf
    currency:
      search_strategy: '"Survey of Consumer Finances" latest wave site:federalreserve.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: psid
    name: Panel Study of Income Dynamics (PSID)
    layer: template
    verification: unverified
    kind: survey
    agency: University of Michigan (ISR)
    identification:
      file_patterns: ["psid_*", "fam_*", "ind_*", "family_*"]
      signal_variables: ["ER30001", "ER30002"]
      loaders: []
      comments: ["Panel Study of Income Dynamics", "PSID"]
    known_variables: ["ER30001", "ER30002"]
    weights:
      - context: Family-level (longitudinal)
        source_name: "[unverified: wave-specific variable; look it up in the PSID cross-year index]"
        notes: Longitudinal family weight.
      - context: Individual-level (longitudinal)
        source_name: "[unverified: wave-specific variable; look it up in the PSID cross-year index]"
        notes: Longitudinal individual weight.
      - context: Cross-section
        source_name: "[unverified: wave-specific variable; look it up in the PSID cross-year index]"
        notes: Appropriate for single-wave analysis.
    pitfalls:
      - id: psid-cross-section-for-panel
        description: Using cross-section weight for panel analysis.
        severity: HIGH
      - id: psid-oversample
        description: Not accounting for PSID oversampling of low-income and Black families.
        severity: MEDIUM
      - id: psid-seo-dropped
        description: SEO oversample dropped without discussion.
        severity: MEDIUM
    currency:
      search_strategy: '"Panel Study of Income Dynamics" latest wave site:psidonline.isr.umich.edu'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: nlsy
    name: National Longitudinal Survey of Youth (NLSY)
    layer: template
    verification: unverified
    kind: survey
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["nlsy_*", "nlsy79_*", "nlsy97_*"]
      signal_variables: ["SAMPLING_WEIGHT_CC", "SAMPLING_PANEL_WEIGHT", "MORTADJ_SAMPWEIGHT"]
      loaders: ["nlstools package"]
      comments: ["NLSY", "National Longitudinal Survey"]
    known_variables: ["SAMPLING_WEIGHT_CC", "SAMPLING_PANEL_WEIGHT", "MORTADJ_SAMPWEIGHT"]
    weights:
      - context: NLSY97 cross-section (one round)
        source_name: SAMPLING_WEIGHT_CC
        notes: Round-specific weight combining the cross-sectional and oversample cases.
      - context: NLSY97 panel (every round from 1 to N)
        source_name: SAMPLING_PANEL_WEIGHT
        notes: Zero for anyone who missed a round.
      - context: Multi-year or respondent subset (NLSY79 or NLSY97)
        source_name: "[unverified: generated per analysis by the NLS custom weighting program; no fixed variable name]"
        notes: Custom weights from nlsinfo.org for the chosen years and respondents.
    pitfalls:
      - id: nlsy-supplemental-samples
        description: NLSY79 military and supplemental samples dropped without acknowledgment.
        severity: LOW
      - id: nlsy-cohort-aging
        description: Using NLSY79 for recent cohort analysis without acknowledging sample aging.
        severity: LOW
    sources:
      - title: NLSY97 Sample Weights and Design Effects (NLS, nlsinfo.org)
        url: https://www.nlsinfo.org/content/cohorts/nlsy97/using-and-understanding-the-data/sample-weights-design-effects
    currency:
      search_strategy: '"NLSY" latest release site:bls.gov/nls'
    vintages: []
    variables: []
    docs: []
