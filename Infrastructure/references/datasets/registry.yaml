    known_variables: ["WPFINWGT", "WHFNWGT", "wpfinwgt", "whfnwgt"]
    weights:
      - context: Person-level
        source_name: WPFINWGT / wpfinwgt
        notes: Final person weight.
      - context: Household-level
        source_name: WHFNWGT / whfnwgt
