# Project-scoped Codex configuration.
#
# Canonical source for `.codex/config.toml`. Edit here, then run `make brain-sync`.
#
# Codex loads project-scoped config, hooks, and execution rules only after the
# repository is marked trusted. If a session appears to ignore this file, check
# the project's trust level first.
#
# Minimal on purpose: only keys verified against the Codex configuration schema
# that this template needs. Model, reasoning effort, provider, and
# authentication belong to user or workspace config. Hooks are on by default,
# so no `[features]` entry is needed; each hook still needs `/hooks` review.

# Ask before anything outside the sandbox, so pipeline runs and publishing stay
# deliberate.
approval_policy = "on-request"

# The sandbox is the execution boundary. The execpolicy in `.codex/rules/` only
# adds prompts and prohibitions; it allows nothing outside the sandbox.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Off by default. Literature scouting and data-dictionary work need the network,
# so those sessions should enable it deliberately.
network_access = false

[agents]
# Enough for the concurrent reviews of a full-review pass plus the coordinating
# session. Subject to account and product concurrency caps.
max_concurrent_threads_per_session = 6
